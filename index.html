<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice Orb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600&display=swap">
<style>
  /* Layout: full-bleed WebGL stage, one floating control bar pinned to the bottom edge.
     The page keeps its own theme switch (Auto / Light / Dark) on body[data-orb], separate from the host's data-theme. */
  :root {
    color-scheme: dark;
    --night: #070B14;
    --ink: #E7ECF5;
    --muted: #8D98AE;
    --line: rgba(160, 180, 220, 0.18);
    --glass: rgba(14, 20, 34, 0.72);
    --chip-on: rgba(255, 255, 255, 0.12);
    --warm: #FF6A3D;
    --cool: #5B9BFF;
    --font-ui: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  body[data-orb="light"] {
    color-scheme: light;
    --night: #F3F5F9;
    --ink: #172033;
    --muted: #5D6880;
    --line: rgba(40, 60, 100, 0.16);
    --glass: rgba(255, 255, 255, 0.78);
    --chip-on: rgba(23, 32, 51, 0.08);
    --warm: #E2492C;
    --cool: #2F6BE0;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--night);
    color: var(--ink);
    font-family: var(--font-ui);
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: var(--night);
    touch-action: none;
  }
  .bar {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(560px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-sizing: border-box;
  }
  .mic {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 11px;
    background: linear-gradient(90deg, var(--warm), var(--cool));
    color: #fff;
    font: 600 14px var(--font-ui);
    cursor: pointer;
  }
  .mic[aria-pressed="true"] { background: var(--chip-on); color: var(--ink); }
  .theme { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 11px; }
  .theme[hidden] { display: none; }
  .theme button {
    min-height: 34px;
    padding: 0 11px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: 600 12px var(--font-ui);
    cursor: pointer;
  }
  .theme button[aria-pressed="true"] { background: var(--chip-on); color: var(--ink); }
  .theme button:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  .mic:focus-visible, input:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: 0.9; }
  .slider {
    flex: 1 1 160px;
    min-width: 0;
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    gap: 2px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--warm); margin: 0; }
  .slider output { justify-self: end; font: 12px var(--font-data); font-variant-numeric: tabular-nums; }
  .file {
    display: inline-flex;
    align-items: center;
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 11px;
    font: 600 13px var(--font-ui);
    color: var(--ink);
    cursor: pointer;
  }
  button.file { background: transparent; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .file:focus-within { outline: 2px solid var(--cool); outline-offset: 2px; }
  .status {
    flex-basis: 100%;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font: 11px/1.4 var(--font-data);
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .meter { display: inline-flex; gap: 3px; align-items: end; height: 12px; }
  .meter i { width: 3px; background: var(--muted); border-radius: 1px; height: 2px; transition: height 60ms linear; }
  @media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
  button.file[hidden] { display: none; }
  .export {
    width: min(360px, calc(100% - 32px));
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: var(--ink);
    font: 13px/1.45 var(--font-ui);
    box-sizing: border-box;
  }
  .export::backdrop { background: rgba(0, 0, 0, 0.35); }
  .export h2 { margin: 0 0 4px; font: 600 15px var(--font-ui); }
  .export p { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  .export .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .export .row > span { color: var(--muted); font-size: 12px; }
  .export .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .export .go { min-height: 40px; padding: 0 16px; border: 0; border-radius: 11px; background: linear-gradient(90deg, var(--warm), var(--cool)); color: #fff; font: 600 13px var(--font-ui); cursor: pointer; }
  .export .go:disabled { opacity: 0.5; cursor: default; }
  .export progress { width: 100%; height: 6px; accent-color: var(--warm); }
  .export output { display: block; min-height: 1.4em; margin-top: 6px; font: 11px/1.4 var(--font-data); color: var(--muted); }
  .rendering #stage { visibility: hidden; }
  .export .row[hidden] { display: none; }
</style>
</head>
<body>

<canvas id="stage" aria-label="Audio-reactive orb"></canvas>

<div class="bar" role="group" aria-label="Orb controls">
  <button class="mic" id="micBtn" type="button" aria-pressed="false"><span class="pulse"></span><span id="micLabel">Use microphone</span></button>
  <label class="slider" for="sens">Sensitivity <output id="sensOut">1.0×</output>
    <input id="sens" type="range" min="0.3" max="3" step="0.1" value="1">
  </label>
  <label class="slider" for="size">Size <output id="sizeOut">100%</output>
    <input id="size" type="range" min="0.4" max="1.6" step="0.05" value="1">
  </label>
  <label class="slider" for="speed">Speed <output id="speedOut">1.0×</output>
    <input id="speed" type="range" min="0" max="3" step="0.1" value="1">
  </label>
  <label class="file" for="voiceFile">AI voice<input id="voiceFile" type="file" accept="audio/*"></label>
  <button class="file" id="copyLink" type="button">Copy link</button>
  <button class="file" id="exportBtn" type="button">Export video</button>
  <div class="theme" role="group" aria-label="Orb style">
    <button type="button" data-style-choice="dots" aria-pressed="true">Dots</button>
    <button type="button" data-style-choice="glass" aria-pressed="false">Glass</button>
  </div>
  <div class="theme" id="stateGroup" role="group" aria-label="Orb state">
    <button type="button" data-state-choice="listening" aria-pressed="true">Listening</button>
    <button type="button" data-state-choice="thinking" aria-pressed="false">Thinking</button>
  </div>
  <div class="theme" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="auto" aria-pressed="true">Auto</button>
    <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
  </div>
  <div class="status" aria-live="polite">
    <span id="statusText">Demo signal</span>
    <span class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </div>
</div>

<dialog class="export" id="exportDlg" aria-labelledby="exportTitle">
  <h2 id="exportTitle">Export loop video</h2>
  <p>Listening → Thinking → Listening, seamless loop. MP4 on pure black: in Figma set the layer blend mode to Screen and the black disappears.</p>
  <div class="row"><span>Size</span>
    <div class="theme" role="group" aria-label="Video size">
      <button type="button" data-export-size="720" aria-pressed="false">720</button>
      <button type="button" data-export-size="1080" aria-pressed="true">1080</button>
      <button type="button" data-export-size="1440" aria-pressed="false">1440</button>
    </div>
  </div>
  <div class="row"><span>Frame rate</span>
    <div class="theme" role="group" aria-label="Frame rate">
      <button type="button" data-export-fps="30" aria-pressed="false">30</button>
      <button type="button" data-export-fps="60" aria-pressed="true">60</button>
    </div>
  </div>
  <div class="row"><span>Loop length</span>
    <div class="theme" role="group" aria-label="Loop length">
      <button type="button" data-export-len="6" aria-pressed="false">6 s</button>
      <button type="button" data-export-len="8" aria-pressed="true">8 s</button>
      <button type="button" data-export-len="10" aria-pressed="false">10 s</button>
    </div>
  </div>
  <div class="row" id="exportDotRow"><span>Dot size</span>
    <div class="theme" role="group" aria-label="Dot size">
      <button type="button" data-export-dot="1" aria-pressed="false">1×</button>
      <button type="button" data-export-dot="2" aria-pressed="true">2×</button>
      <button type="button" data-export-dot="3" aria-pressed="false">3×</button>
    </div>
  </div>
  <progress id="exportProg" value="0" max="1" hidden></progress>
  <output id="exportMsg" aria-live="polite"></output>
  <div class="actions">
    <button class="file" type="button" id="exportClose">Close</button>
    <button class="go" type="button" id="exportGo">Export</button>
  </div>
</dialog>

<script>
(() => {
  const canvas = document.getElementById('stage');
  const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' });
  const statusText = document.getElementById('statusText');
  if (!gl) { statusText.textContent = 'WebGL2 is not available in this browser.'; return; }

  // Geometry: small dots laid along meridians, so the sphere reads as vertical strands of tiny orbs.
  const MERIDIANS = 140;
  const PER_LINE = 110; // ~15k dots, same budget as Murmuration Lab
  const COUNT = MERIDIANS * PER_LINE;
  const uv = new Float32Array(COUNT * 2);
  for (let m = 0, i = 0; m < MERIDIANS; m++) {
    for (let k = 0; k < PER_LINE; k++, i += 2) {
      uv[i] = m / MERIDIANS;
      uv[i + 1] = (k + 0.5) / PER_LINE;
    }
  }

  const vs = `#version 300 es
  precision highp float;
  layout(location=0) in vec2 aUV;
  // Same clock split as the glass orb: *L for Listening (sphere), *T for Thinking (ring).
  uniform float uTimeL, uTimeT, uRotL, uSpinT, uFlowT, uMorph;
  uniform float uLevel, uBass, uMid, uHigh, uPass, uDpr, uLight;
  uniform vec2 uFit;
  out vec3 vColor;
  out float vAlpha;

  // 3D simplex noise (Ashima Arts / Stefan Gustavson, MIT).
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }

  vec3 rotX(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }

  void main(){
    float theta = aUV.x * 6.2831853;
    float phi = aUV.y * 3.1415926;
    vec3 dir = vec3(sin(phi) * cos(theta), cos(phi), sin(phi) * sin(theta));
    float m = uMorph, listen = 1.0 - m;

    // ---- Listening: the sphere of meridian strands (driven by the *L clocks) ----
    float topW = smoothstep(-0.2, 1.0, dir.y);
    float botW = smoothstep(0.2, -1.0, dir.y);
    float t = uTimeL;
    // Slow base wobble plus finer ripples; audio bands scale them by region.
    float n1 = snoise(dir * 1.5 + vec3(0.0, t * 0.22, t * 0.1));
    float n2 = snoise(dir * 4.2 + vec3(t * 0.5, 0.0, -t * 0.35));
    float n3 = snoise(dir * 9.0 + vec3(0.0, -t * 0.9, t * 0.6));
    float amp = 0.035 + 0.16 * uLevel + 0.22 * uBass * botW + 0.10 * uMid;
    float fine = 0.012 + 0.10 * uHigh * (0.4 + topW);
    float r = 1.0 + amp * (0.65 * n1 + 0.35 * n2) + fine * n3 + 0.06 * uLevel;
    vec3 p = dir * r;
    // Spin around Y, slight tilt toward the camera.
    float c = cos(uRotL), s = sin(uRotL);
    p = vec3(c * p.x + s * p.z, p.y, -s * p.x + c * p.z);
    vec3 nrm = vec3(c * dir.x + s * dir.z, dir.y, -s * dir.x + c * dir.z);
    p = rotX(p, 0.28);
    nrm = rotX(nrm, 0.28);

    // ---- Thinking: the same dots wrap a ring facing the camera (driven by the *T clocks) ----
    // Each meridian becomes one coil around the tube; the coils slide around it and the ring turns slowly.
    float tt = uTimeT;
    float al = 3.1415926 - 2.0 * phi + uFlowT;
    float th = theta + uSpinT * 0.3 + 0.16 * (phi - 1.5707963); // a slight twist: each coil leans like a rope strand
    float rt = 0.22 * (1.0 + 0.14 * snoise(vec3(cos(theta) * 0.9, sin(theta) * 0.9, tt * 0.25)));
    vec3 tn = vec3(cos(al) * cos(th), cos(al) * sin(th), sin(al));
    vec3 tp = vec3(0.74 * cos(th), 0.74 * sin(th), 0.0) + rt * tn;
    float breath = (sin(tt * 1.7) + 0.6 * sin(tt * 2.93 + 1.3) + 0.35 * sin(tt * 0.71 + 2.1)) / 1.95;
    float wob = snoise(tp * 0.55 + vec3(tt * 0.2, -tt * 0.15, tt * 0.17));
    tp *= 1.0 + 0.02 * breath + 0.04 * wob;
    tp = rotX(tp, 0.12);
    tn = rotX(tn, 0.12);

    // ---- Blend: dots fly from one layout to the other, scattering a little mid-way like a flock ----
    vec3 q = mix(p, tp, m);
    float sc = 0.22 * sin(3.1415926 * m);
    q += sc * vec3(snoise(dir * 1.7 + vec3(t * 0.3, 0.0, 0.0)),
                   snoise(dir * 1.7 + vec3(0.0, 17.0, t * 0.3)),
                   snoise(dir * 1.7 + vec3(31.0, t * 0.3, 0.0)));
    p = q;

    float d = 3.6;
    gl_Position = vec4(p.x * uFit.x * d, p.y * uFit.y * d, 0.0, d - p.z);

    // Fresnel: bright at the silhouette, almost clear through the middle. Blended as a value (normals can cancel).
    float rim = mix(1.0 - abs(nrm.z), 1.0 - abs(tn.z), m);
    rim *= 1.0 - 0.3 * sin(3.1415926 * m); // a little calmer while scattered
    float edge = pow(rim, 2.6);

    // Screen-fixed gradient: warm on top, cool at the bottom.
    vec3 warm = mix(vec3(1.0, 0.36, 0.20), vec3(0.89, 0.26, 0.14), uLight);
    vec3 cool = mix(vec3(0.30, 0.56, 1.0), vec3(0.16, 0.38, 0.88), uLight);
    vec3 col = mix(cool, warm, smoothstep(-0.85, 0.85, p.y));
    // Dark: the rim burns toward white. Light: it deepens instead, since glow can't brighten a white page.
    vec3 hot = mix(vec3(1.0, 0.94, 0.9), col * 0.62, uLight);
    col = mix(col, hot, pow(rim, 6.0) * (0.55 + 0.4 * uLevel));

    float a = (0.12 + 0.88 * edge + 0.2 * uLevel * edge) * mix(1.0, 0.7, m); // the ring packs the dots tighter
    vColor = col;
    vAlpha = uPass < 0.5 ? a : a * mix(0.07, 0.035, uLight);
    gl_PointSize = (uPass < 0.5 ? 2.3 : 8.0) * uDpr;
  }`;

  const fs = `#version 300 es
  precision highp float;
  uniform float uPass;
  in vec3 vColor;
  in float vAlpha;
  out vec4 outColor;
  void main(){
    float d = length(gl_PointCoord - 0.5) * 2.0;
    float a = uPass < 0.5 ? smoothstep(1.0, 0.55, d) : pow(max(0.0, 1.0 - d), 2.0);
    float k = min(1.0, vAlpha * a);
    outColor = vec4(vColor * k, k); // premultiplied: additive in dark, "over" in light
  }`;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { statusText.textContent = 'Shader error: ' + gl.getProgramInfoLog(prog); return; }

  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ['uTimeL','uTimeT','uRotL','uSpinT','uFlowT','uMorph','uLevel','uBass','uMid','uHigh','uPass','uDpr','uFit','uLight'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // ---- Glass orb: a translucent shell plus three silk ribbons, drawn as plain triangle meshes ----
  // Listening = glass sphere with two wide silk bands inside.
  // Thinking  = glass ring made of three thick tubes, slightly offset from each other.
  // uMorph blends sphere -> ring; mid-way the ribbons fade and the shell turns into a soft blob.
  // In dark theme the scene renders to a float target and gets a quarter-res bloom.
  const NOISE_GLSL = vs.slice(vs.indexOf('vec3 mod289'), vs.indexOf('vec3 rotX'));
  const RIBBONS = 3, RIB_ALONG = 320, RIB_ACROSS = 24, SH_U = 160, SH_V = 80;
  const gvs = `#version 300 es
  precision highp float;
  layout(location=0) in vec3 aP; // x: along (0..1), y: across, z: kind (-1 shell, 0..2 ribbon)
  // Two sets of clocks: *L drive only what Listening shows, *T only what Thinking shows.
  // Live they tick together; the loop export rewinds each one while the other state fills the screen.
  uniform float uTimeL, uTimeT, uSpinL, uSpinT, uFlowL, uFlowT;
  uniform float uLevel, uBass, uHigh, uMorph, uBreak;
  uniform vec2 uFit;
  out vec3 vN;
  out vec2 vS;
  out float vW, vK, vVis, vZ, vGapA, vGapB, vGapT;
  ${NOISE_GLSL}
  const float PI = 3.1415926, TAU = 6.2831853;
  const float RM = 0.74, RT = 0.22; // glass torus: major / minor radius
  vec3 rotX(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }
  vec3 rotY(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z); }
  vec3 rotZ(vec3 p, float a){ float c = cos(a), s = sin(a); return vec3(c*p.x - s*p.y, s*p.x + c*p.y, p.z); }

  vec3 shellAt(vec2 q){
    float th = q.x * TAU, ph = clamp(q.y, 0.002, 0.998) * PI;

    wave = new Uint8Array(analyser.fftSize);
  }
  const listening = () => !!stream || (!!playerSrc && !player.paused);
  function refreshStatus() {
    const parts = [];
    if (stream) parts.push('Listening to you');
    if (playerSrc && !player.paused) parts.push('AI voice playing');
    statusText.textContent = parts.length ? parts.join(' + ') : 'Demo signal';
  }

  async function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      statusText.textContent = 'Microphone needs HTTPS. Showing demo signal.';
      return;
    }
    try {
      ensureAudio();
      await ctx.resume();
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      micSrc = ctx.createMediaStreamSource(stream);
      micSrc.connect(mix); // not sent to the speakers, so no feedback
      micBtn.setAttribute('aria-pressed', 'true');
      micLabel.textContent = 'Stop microphone';
      refreshStatus();
    } catch (err) {
      stream = null;
      statusText.textContent = err && err.name === 'NotAllowedError'
        ? 'Microphone blocked here. Showing demo signal.'
        : 'Could not open the microphone. Showing demo signal.';
    }
  }
  function stopMic() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (micSrc) micSrc.disconnect();
    stream = null; micSrc = null;
    micBtn.setAttribute('aria-pressed', 'false');
    micLabel.textContent = 'Use microphone';
    refreshStatus();
  }
  micBtn.addEventListener('click', () => (stream ? stopMic() : startMic()));

  document.getElementById('voiceFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    ensureAudio();
    await ctx.resume();
    if (player.src) URL.revokeObjectURL(player.src);
    player.src = URL.createObjectURL(file);
    if (!playerSrc) {
      playerSrc = ctx.createMediaElementSource(player);
      playerSrc.connect(mix);
      playerSrc.connect(ctx.destination); // you hear it, the orb sees it
    }
    try { await player.play(); } catch { statusText.textContent = 'Tap again to play the audio.'; }
    refreshStatus();
  });
  player.addEventListener('ended', refreshStatus);
  player.addEventListener('pause', refreshStatus);

  function bandAvg(lo, hi) {
    const nyq = ctx.sampleRate / 2, n = freq.length;
    const a = Math.max(1, Math.floor(lo / nyq * n)), b = Math.min(n - 1, Math.ceil(hi / nyq * n));
    let sum = 0;
    for (let i = a; i <= b; i++) sum += freq[i];
    return sum / ((b - a + 1) * 255);
  }

  function readAudio(t) {
    const k = Number(sens.value);
    let level, bass, mid, high;
    if (listening()) {
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(wave);
      let rms = 0;
      for (let i = 0; i < wave.length; i++) { const v = (wave[i] - 128) / 128; rms += v * v; }
      level = Math.sqrt(rms / wave.length) * 4;
      bass = bandAvg(40, 250) * 1.6;
      mid = bandAvg(250, 2000) * 1.8;
      high = bandAvg(2000, 8000) * 2.6;
    } else {
      // Speech-like demo: syllable bursts inside slower phrases.
      const phrase = Math.max(0, Math.sin(t * 0.55) * 0.8 + 0.35);
      const syl = Math.pow(Math.max(0, Math.sin(t * 7.3) * Math.sin(t * 2.9 + 1.2)), 1.5);
      level = phrase * (0.25 + 0.75 * syl) * 0.75;
      bass = level * (0.6 + 0.4 * Math.sin(t * 1.3));
      mid = level * 0.8;
      high = level * (0.5 + 0.5 * Math.sin(t * 5.1 + 0.4));
    }
    const target = { level, bass, mid, high };
    for (const key in live) {
      const v = Math.min(1.2, target[key] * k);
      live[key] += (v - live[key]) * (v > live[key] ? 0.45 : 0.07); // fast attack, slow release
    }
  }

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = performance.now();
  let rot = 0, last = start, motionTime = 0;
  // Glass: morph progress 0 (listening sphere) -> 1 (thinking ring), eased, ~1.4 s each way.
  let morphP = stateChoice === 'thinking' ? 1 : 0, spin = 0, flow = 0;
  const MORPH_SECS = 1.4;

  // One glass frame: clocks + audio values in, drawn to `out` (null = screen) through the bloom targets `rt`.
  function renderGlass(st, rt, out, w, h, bg, flipY) {
    gl.useProgram(gprog);
    gl.bindVertexArray(gvao);
    gl.uniform2f(GU.uFit, st.fit[0], st.fit[1]);
    gl.uniform1f(GU.uTimeL, st.timeL); gl.uniform1f(GU.uTimeT, st.timeT);
    gl.uniform1f(GU.uSpinL, st.spinL); gl.uniform1f(GU.uSpinT, st.spinT);
    gl.uniform1f(GU.uFlowL, st.flowL); gl.uniform1f(GU.uFlowT, st.flowT);
    gl.uniform1f(GU.uLevel, st.level);
    gl.uniform1f(GU.uBass, st.bass);
    gl.uniform1f(GU.uHigh, st.high);
    gl.uniform1f(GU.uMorph, st.morph);
    if (!rt) { gl.drawElements(gl.TRIANGLES, G_COUNT, gl.UNSIGNED_SHORT, 0); return; } // light theme

    // Dark: scene into a float target (additive), then bloom and composite onto the background.
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.scene.fbo);
    gl.viewport(0, 0, rt.scene.w, rt.scene.h);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.drawElements(gl.TRIANGLES, G_COUNT, gl.UNSIGNED_SHORT, 0);

    gl.disable(gl.BLEND);
    gl.useProgram(blurProg);
    gl.bindVertexArray(postVao);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform1i(BU.tex, 0);
    blurPass(rt.scene, rt.a, 0, 0);   // downsample
    blurPass(rt.a, rt.b, 1, 0); blurPass(rt.b, rt.a, 0, 1);
    blurPass(rt.a, rt.b, 2.5, 0); blurPass(rt.b, rt.a, 0, 2.5);

    gl.bindFramebuffer(gl.FRAMEBUFFER, out);
    gl.viewport(0, 0, w, h);
    gl.useProgram(compProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, rt.scene.tex);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rt.a.tex);
    gl.uniform1i(CU.scene, 0); gl.uniform1i(CU.bloom, 1);
    gl.uniform3f(CU.bg, bg[0], bg[1], bg[2]);
    gl.uniform1f(CU.glow, 0.6);
    gl.uniform1f(CU.sat, GLASS_SAT);
    gl.uniform1f(CU.flip, flipY ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.enable(gl.BLEND);
    gl.clearColor(0.027, 0.043, 0.078, 1); // dark clear colour for the next frame (blend stays ONE, ONE)
  }

  const DARK_BG = [0.027, 0.043, 0.078];
  // Shared by both styles: eased morph 0 (Listening) -> 1 (Thinking), plus the Thinking spin/flow clocks.
  function advanceMorph(dt, speed) {
    const target = stateChoice === 'thinking' ? 1 : 0;
    const step = reduceMotion ? 1 : dt / MORPH_SECS;
    morphP += Math.max(-step, Math.min(step, target - morphP));
    const m = morphP * morphP * (3 - 2 * morphP);
    // Pace drifts instead of ticking at a fixed rate (incommensurate sines never line up).
    const tt = motionTime;
    const pace = 1 + 0.35 * m * (Math.sin(tt * 0.53) * 0.6 + Math.sin(tt * 1.37 + 0.8) * 0.4);
    spin += dt * speed * (0.18 + 0.3 * live.level) * (1 + 1.6 * m) * pace;
    flow += dt * speed * (0.35 + 0.9 * m) * (2 - pace);
    return m;
  }

  function drawGlass(m) {
    // Live, both clock sets are the same clock.
    const st = { timeL: motionTime, timeT: motionTime, spinL: spin, spinT: spin, flowL: flow, flowT: flow,
                 level: live.level, bass: live.bass, high: live.high, morph: m, fit: liveFit };
    if (isLight) { gl.useProgram(gprog); gl.uniform1f(GU.uLight, 1); renderGlass(st, null); return; }
    renderGlass(st, { scene: rtScene, a: rtA, b: rtB }, null, canvas.width, canvas.height, DARK_BG, false);
  }

  let exporting = false;
  function frame(now) {
    if (exporting) { last = now; requestAnimationFrame(frame); return; }
    const t = (now - start) / 1000;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    readAudio(t);
    const speed = Number(speedInput.value) * (reduceMotion ? 0.3 : 1);
    motionTime += dt * speed;
    rot += dt * speed * (0.12 + live.level * 0.25);

    gl.clear(gl.COLOR_BUFFER_BIT);
    const m = advanceMorph(dt, speed);
    if (styleChoice === 'glass') drawGlass(m);
    else renderDots({ timeL: motionTime, timeT: motionTime, rotL: rot, spinT: spin, flowT: flow, morph: m,
                      level: live.level, bass: live.bass, mid: live.mid, high: live.high, fit: liveFit },
                    null, canvas.width, canvas.height, dpr);
    const vals = [live.bass, live.mid, live.high, live.level];
    bars.forEach((b, i) => { b.style.height = (2 + Math.min(1, vals[i]) * 10) + 'px'; });
    requestAnimationFrame(frame);
  }

  // One dots frame into `out` (null = screen). Point sizes are in pixels, so `pointScale` keeps them in proportion.
  function renderDots(st, out, w, h, pointScale) {
    gl.useProgram(prog);
    gl.bindVertexArray(vao);
    gl.bindFramebuffer(gl.FRAMEBUFFER, out);
    gl.viewport(0, 0, w, h);
    gl.uniform1f(U.uTimeL, st.timeL); gl.uniform1f(U.uTimeT, st.timeT);
    gl.uniform1f(U.uRotL, st.rotL); gl.uniform1f(U.uSpinT, st.spinT); gl.uniform1f(U.uFlowT, st.flowT);
    gl.uniform1f(U.uMorph, st.morph);
    gl.uniform1f(U.uLevel, st.level);
    gl.uniform1f(U.uBass, st.bass);
    gl.uniform1f(U.uMid, st.mid);
    gl.uniform1f(U.uHigh, st.high);
    gl.uniform2f(U.uFit, st.fit[0], st.fit[1]);
    gl.uniform1f(U.uDpr, pointScale);
    gl.uniform1f(U.uPass, 1); gl.drawArrays(gl.POINTS, 0, COUNT); // halo
    gl.uniform1f(U.uPass, 0); gl.drawArrays(gl.POINTS, 0, COUNT); // crisp lines
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ---- Loop export: Listening -> Thinking -> Listening, rendered offline frame by frame, MP4 on pure black ----
  // Seamless because every input is periodic over the loop: the morph and the voice are periodic by construction,
  // the Listening clocks rewind in the middle of the Thinking hold (Listening is fully hidden there), and the
  // Thinking clocks restart at the loop seam (Thinking is fully hidden there). Frame N would equal frame 0.
  function loopState(t, L, speed) {
    const M = MORPH_SECS, hold = (L - 2 * M) / 2;      // Listening total = Thinking hold
    const t1 = hold / 2, t2 = t1 + M, t3 = t2 + hold, t4 = t3 + M, tMid = (t2 + t3) / 2;
    const ease = x => x * x * (3 - 2 * x);
    const morph = t < t1 ? 0 : t < t2 ? ease((t - t1) / M) : t < t3 ? 1 : t < t4 ? ease(1 - (t - t3) / M) : 0;
    const lc = (t < tMid ? t : t - L) * speed, tc = (t - tMid) * speed;
    // A gentle, periodic "voice" while listening (whole cycles per loop, so it lines up at the seam).
    const TAU = Math.PI * 2, k1 = Math.max(1, Math.round(L * 0.5)), k2 = Math.max(2, Math.round(L * 1.6));
    const v = (1 - morph) * 0.32 * (0.55 + 0.45 * Math.sin(TAU * k1 * t / L)) * (0.6 + 0.4 * Math.sin(TAU * k2 * t / L + 1.3));
    return { timeL: lc, spinL: 0.18 * lc, flowL: 0.35 * lc, rotL: 0.12 * lc,
             timeT: tc, spinT: 0.468 * tc, flowT: 1.25 * tc,
             level: v, bass: v * 0.9, mid: v * 0.8, high: v * 0.7, morph, fit: [0.6, 0.6] };
  }

  async function exportLoop({ size, fps, length, dot }, style, onProgress) {
    const MB = await import('./vendor/mediabunny.min.mjs');
    const W = size, H = size, N = Math.round(length * fps), L = N / fps;
    const speed = Number(speedInput.value);
    const codec = await MB.getFirstEncodableVideoCodec(['avc', 'vp9'], { width: W, height: H });
    if (!codec) throw new Error('This browser cannot encode video. Try Chrome or Edge.');
    const isMp4 = codec === 'avc';
    const target = new MB.BufferTarget();
    const output = new MB.Output({
      format: isMp4 ? new MB.Mp4OutputFormat({ fastStart: 'in-memory' }) : new MB.WebMOutputFormat(),
      target,
    });
    // One key frame per loop: every key frame resets compression drift, which reads as a faint pulse in calm stretches.
    // Generous bitrate: soft glow gradients band and shimmer at ordinary rates (~0.3 bits per pixel).
    const quality = new MB.Quality({ bitrate: Math.round(W * H * fps * 0.3) });
    const source = new MB.VideoSampleSource({ codec, quality, keyFrameInterval: L });
    output.addVideoTrack(source, { frameRate: fps });
    await output.start();

    const rt = { scene: makeTarget(W, H), a: makeTarget(W >> 2, H >> 2), b: makeTarget(W >> 2, H >> 2) };
    const out = makeTarget(W, H, true);
    const pixels = new Uint8Array(W * H * 4);
    try {
      // Always the dark look, on pure black.
      gl.useProgram(gprog); gl.uniform1f(GU.uLight, 0);
      gl.useProgram(prog); gl.uniform1f(U.uLight, 0);
      for (let k = 0; k < N; k++) {
        const st = loopState(k / fps, L, speed);
        if (style === 'glass') {
          renderGlass(st, rt, out.fbo, W, H, [0, 0, 0], true);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo);
          gl.viewport(0, 0, W, H);
          gl.clearColor(0, 0, 0, 1);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.enable(gl.BLEND);
          gl.blendFunc(gl.ONE, gl.ONE);
          st.fit = [0.6, -0.6]; // flipped, so readPixels comes out top-down
          // Videos usually play much smaller than they're rendered (a 1080 px file shown at ~200 pt in Figma),
          // and 1 px dots average away when scaled down, so the dot size is a choice. 2x reads well at ~1/3 scale.
          renderDots(st, out.fbo, W, H, W / 800 * dot);
        }
        gl.bindFramebuffer(gl.FRAMEBUFFER, out.fbo);
        gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        const sample = new MB.VideoSample(pixels, { format: 'RGBA', codedWidth: W, codedHeight: H, timestamp: k / fps, duration: 1 / fps });
        await source.add(sample);
        sample.close();
        onProgress((k + 1) / N);
      }
      await output.finalize();
    } catch (err) {
      if (output.state !== 'finalized') await output.cancel().catch(() => {});
      throw err;
    } finally {
      [rt.scene, rt.a, rt.b, out].forEach(freeTarget);
    }
    return { blob: new Blob([target.buffer], { type: isMp4 ? 'video/mp4' : 'video/webm' }), ext: isMp4 ? 'mp4' : 'webm' };
  }

  const exportDlg = document.getElementById('exportDlg');
  const exportGo = document.getElementById('exportGo');
  const exportProg = document.getElementById('exportProg');
  const exportMsg = document.getElementById('exportMsg');
  const exportOpts = { size: 1080, fps: 60, length: 8, dot: 2 };
  [['size', 'exportSize'], ['fps', 'exportFps'], ['length', 'exportLen'], ['dot', 'exportDot']].forEach(([key, attr]) => {
    const btns = exportDlg.querySelectorAll('[data-' + attr.replace(/[A-Z]/g, c => '-' + c.toLowerCase()) + ']');
    btns.forEach(b => b.addEventListener('click', () => {
      exportOpts[key] = Number(b.dataset[attr]);
      btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    }));
  });
  document.getElementById('exportBtn').addEventListener('click', () => {
    exportMsg.textContent = '';
    document.getElementById('exportDotRow').hidden = styleChoice !== 'dots';
    exportDlg.showModal();
  });
  document.getElementById('exportClose').addEventListener('click', () => exportDlg.close());
  exportDlg.addEventListener('cancel', e => { if (exporting) e.preventDefault(); });
  exportGo.addEventListener('click', async () => {
    exporting = true;
    exportGo.disabled = true;
    document.getElementById('exportClose').disabled = true;
    exportProg.hidden = false; exportProg.value = 0;
    exportMsg.textContent = 'Rendering…';
    document.body.classList.add('rendering');
    const t0 = performance.now();
    try {
      const style = styleChoice;
      const { blob, ext } = await exportLoop(exportOpts, style, p => {
        exportProg.value = p;
        exportMsg.textContent = 'Rendering… ' + Math.round(p * 100) + '%';
      });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const dotTag = style === 'dots' ? `-dots${exportOpts.dot}x` : '';
      a.download = `voice-orb-${style}-loop-${exportOpts.size}p${exportOpts.fps}-${exportOpts.length}s${dotTag}.${ext}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      exportMsg.textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)} s · ${(blob.size / 1048576).toFixed(1)} MB` + (ext === 'webm' ? ' · WebM (MP4 not available here)' : '');
    } catch (err) {
      exportMsg.textContent = 'Export failed: ' + (err && err.message ? err.message : err);
    } finally {
      document.body.classList.remove('rendering');
      exporting = false;
      exportGo.disabled = false;
      document.getElementById('exportClose').disabled = false;
      exportProg.hidden = true;
      resize();
      applyTheme(); // restores the theme's blend mode and clear colour
    }
  });
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
